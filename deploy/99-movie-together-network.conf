net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Large TCP buffers for long-haul high BDP links (e.g. transcontinental Europe <-> Korea)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# Prevent resetting congestion window to initial cwnd after brief idle periods between HLS segments
net.ipv4.tcp_slow_start_after_idle = 0
# Avoid bufferbloat in the local socket buffer; keeps WebSocket and voice responsive during heavy video transfer
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_sack = 1
# Docker needs forwarding for its NAT rules; provider images often pin it to 0.
net.ipv4.ip_forward = 1
