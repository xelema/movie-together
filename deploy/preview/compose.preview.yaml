# Preview d'une pull request : un conteneur app que le proxy de
# deploy/preview/compose.yaml joint par l'alias pr-<numero>-app sur le reseau
# `previews`. Les variables viennent de l'env-file genere par up.sh : ce fichier
# n'est pas destine a etre lance a la main.
services:
  app:
    image: ${PREVIEW_IMAGE:?}
    # Une preview ne doit jamais redemarrer en boucle : si elle tombe, c'est un
    # resultat de test, pas un service a retablir.
    restart: 'no'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      # L'origine doit correspondre exactement a ce que le navigateur envoie, port
      # compris : le serveur refuse toute requete mutante dont l'Origin differe.
      APP_ORIGIN: ${PREVIEW_ORIGIN:?}
      ADMIN_PASSWORD: ${PREVIEW_ADMIN_PASSWORD:?}
      DATA_DIR: /data
      TRUST_PROXY: '1'
      MIN_BUFFER_SECONDS: ${MIN_BUFFER_SECONDS:-20}
      LOW_BUFFER_SECONDS: ${LOW_BUFFER_SECONDS:-5}
      # Une preview ne doit pas prendre les deux coeurs de la VM pendant qu'une
      # seance tourne en production.
      ENCODE_THREADS: '1'
    volumes:
      - ${PREVIEW_DATA:?}:/data
    cpus: '1.0'
    mem_limit: 2g
    networks:
      previews:
        aliases:
          - ${PREVIEW_ALIAS:?}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  previews:
    external: true
    name: previews
