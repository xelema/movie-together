name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install ffmpeg
        run: |
          # The apt build ships the codec libraries browsers dlopen for playback; the pinned
          # static build shadows it on PATH and is what the application and tests exercise.
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libegl-mesa0 libglx-mesa0
          asset=ffmpeg-n8.1.2-52-g5a03dfa0f6-linux64-gpl-8.1
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-11-13-20/$asset.tar.xz" -o /tmp/ffmpeg.tar.xz
          echo "6fc8d0a3ac9e3956bef486655fbc0a049fb3dacb74ea2e44cc2fc62eeb80a182  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install -m 755 "/tmp/$asset/bin/ffmpeg" "/tmp/$asset/bin/ffprobe" /usr/local/bin/
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run -a npm run test:e2e
      - run: docker build -t movie-night:test .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
