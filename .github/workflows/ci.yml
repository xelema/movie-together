name: Checks
on:
  push:
    branches: [main]
    # Documentation seule : la suite e2e (14 min de 2 vCPU partages avec la prod)
    # ne dit rien d'un fichier markdown. Aucun filtre sur e2e/, src/, public/ ni
    # .github/ : c'est exactement ce que la suite verifie. Un changement de doc
    # ne declenche donc pas le Deploy (workflow_run sur Checks) : l'image reste
    # sur le commit precedent, sans effet sur l'application servie.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: self-hosted
    # La suite e2e dure ~13 min sur une box au repos et partage ses 2 vCPU avec
    # la prod : 20 min se faisaient dépasser au premier ralentissement, et un job
    # annulé sur le commit de merge saute le déploiement (il exige un Checks vert).
    timeout-minutes: 40
    env:
      # Un merge dont l'arbre est deja celui que la CI de PR a verifie peut sauter
      # la suite : le garde-fou ci-dessous refuse le raccourci si main a derive.
      SKIP_E2E: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[skip-e2e]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Verifier que le merge est bien celui qui a ete teste
        if: env.SKIP_E2E == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Le marqueur n'autorise a sauter la suite que si l'arbre du commit de
          # merge est exactement celui que la PR a fait verifier : si main a bouge
          # entre le run de PR et le merge, le resultat n'a jamais ete teste et on
          # echoue au lieu de sauter en silence.
          pr=$(python3 - "$GITHUB_SHA" <<'PY'
          import json, os, sys, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sys.argv[1]}/pulls"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json"})
          pulls = json.load(urllib.request.urlopen(req))
          print(pulls[0]["number"] if pulls else "")
          PY
          )
          if [ -z "$pr" ]; then
            echo "::error::marqueur [skip-e2e] sans PR associee : la suite doit tourner"
            exit 1
          fi
          git fetch -q origin "pull/$pr/head:refs/remotes/origin/pr-head"
          if ! git diff --quiet origin/pr-head HEAD; then
            echo "::error::l'arbre du merge differe de celui verifie par la PR #$pr (main a bouge) : la suite doit tourner"
            exit 1
          fi
          echo "arbre identique a celui verifie par la PR #$pr : suite e2e sautee"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install ffmpeg
        run: |
          # The apt build ships the codec libraries browsers dlopen for playback; the pinned
          # static build shadows it on PATH and is what the application and tests exercise.
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libegl-mesa0 libglx-mesa0 pulseaudio
          # Same pinned build as the Dockerfile, picked per runner architecture.
          # Use a monthly BtbN snapshot (end-of-month tags are retained permanently; daily tags expire after 14 days).
          case "$(uname -m)" in
            x86_64)  asset=ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-8.1;    sha=c733b4b2951e5957e15505f788b2c65a7a41b6da4b289e295852cc38079b4d2b ;;
            aarch64) asset=ffmpeg-n8.1.2-50-g1a748fe2cd-linuxarm64-gpl-8.1; sha=ae5da4f51b9052390f414005f8ab26c1eed1268f327cce7cb79aa076b29bd66e ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          # /tmp is shared and survives across runs on a self-hosted runner.
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/$asset.tar.xz" -o "$tmp/ffmpeg.tar.xz"
          echo "$sha  $tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "$tmp/ffmpeg.tar.xz" -C "$tmp"
          sudo install -m 755 "$tmp/$asset/bin/ffmpeg" "$tmp/$asset/bin/ffprobe" /usr/local/bin/
          rm -rf "$tmp"
      - run: npm ci
      - run: npm test
      # La suite, et son installation, ne tournent pas quand le marqueur atteste que
      # l'arbre est celui que la CI de PR a deja verifie (le garde-fou ci-dessus a
      # refuse le raccourci sinon).
      - run: npx playwright install --with-deps chromium firefox webkit
        if: env.SKIP_E2E != 'true'
      - run: |
          pulseaudio --start --exit-idle-time=-1 || true
          xvfb-run -a npm run test:e2e
        if: env.SKIP_E2E != 'true'
      - run: docker build -t movie-night:test .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
